<!doctype html>
<html class="dark">
<head>
<meta charset="utf-8">
<style></style>
</head>
<body data-mode="none">
<div id="veil"></div>
<div id="home">
  <div class="mark">xeno</div>
  <div class="keys" id="primer"></div>
</div>
<section id="bar" class="panel">
  <label class="field">
    <span class="glyph" id="glyph"></span>
    <span class="input">
      <span id="ghost"></span>
      <input id="q" spellcheck="false" autocomplete="off" placeholder="Search or enter address">
    </span>
  </label>
  <div class="list" id="results"><div class="hl"></div><div class="rows"></div></div>
  <footer class="tips" id="tips"></footer>
</section>
<section id="switch" class="panel">
  <header><span>Tabs</span><span id="usage"></span></header>
  <div class="list" id="cards"><div class="hl"></div><div class="rows"></div></div>
  <footer class="tips" id="hold"></footer>
</section>
<section id="settings" class="panel">
  <nav id="nav"></nav>
  <main id="pane"></main>
</section>
<div id="toast"></div>
<div id="peek"></div>
<script></script>
</body>
</html>
